name: CI Pipeline - ck-mcp-server → GHCR Patch Release

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build-workflow]

permissions:
  contents: write
  packages: write

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_PATH: ghcr.io/ckgitrepouser/prod/ck-mcp-server/ck-mcp-server
jobs:
  build-push-verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump patch version
        id: version
        uses: firgga-sunil/poc-app-of-apps/.github/actions/fetch-and-increment-version@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   

      - name: Build and push Docker image
        uses: firgga-sunil/poc-app-of-apps/.github/actions/docker-build-push@main
        with:
          image: ${{ env.DOCKER_IMAGE_PATH }}
          new_tag: ${{ steps.version.outputs.new_tag }}
          username: ${{ secrets.GPR_USER }}
          password: ${{ secrets.GPR_TOKEN }}

      - name: Verify image exists in GHCR
        uses: firgga-sunil/poc-app-of-apps/.github/actions/verify-image-upload@main
        with:
          image: ${{ env.DOCKER_IMAGE_PATH }}
          new_tag: ${{ steps.version.outputs.new_tag }}  
 
      - name: Create GitHub Release
        uses: firgga-sunil/poc-app-of-apps/.github/actions/create-github-release@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          new_tag: ${{ steps.version.outputs.new_tag }}
          latest_tag: ${{ steps.version.outputs.latest_tag }}
          image: ${{ env.DOCKER_IMAGE_PATH }}
      # -------------------------------
      # Summary
      # -------------------------------
      - name: Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" | tee -a $GITHUB_STEP_SUMMARY
          echo "✅ PIPELINE COMPLETED" | tee -a $GITHUB_STEP_SUMMARY
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          echo "**Previous Tag:** ${{ steps.version.outputs.previous_tag }}" | tee -a $GITHUB_STEP_SUMMARY
          echo "**New Tag:** ${{ steps.version.outputs.new_tag }}" | tee -a $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKER_IMAGE_PATH }}:${{ steps.version.outputs.new_tag }}\`" | tee -a $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.DOCKER_IMAGE_PATH }}:${{ steps.version.outputs.new_tag }}\`" | tee -a $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" | tee -a $GITHUB_STEP_SUMMARY
